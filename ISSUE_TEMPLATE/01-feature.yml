name: 기능 추가
description: 신규 기능 및 사용자 요구사항 등록
title: "[기능] "
body:
  - type: markdown
    attributes:
      value: |
        신규 기능의 목적과 완료 조건 중심의 작업 내용 작성

  - type: textarea
    id: purpose
    attributes:
      label: 작업 목적
      description: 해결하려는 문제와 기대 효과 작성
      placeholder: 작업 목적 및 기대 효과
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 포함 범위와 제외 범위 작성
      placeholder: |
        포함 범위:
        -

        제외 범위:
        -
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 작업 완료를 판단할 수 있는 조건 작성
      placeholder: |
        -
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: 참고 자료
      description: 디자인, 문서, 관련 Issue 및 링크 첨부
      placeholder: 관련 자료 및 링크
    validations:
      required: false
