name: 버그 수정
description: 오류 및 예외 동작 등록
title: "[버그] "
body:
  - type: markdown
    attributes:
      value: |
        재현 가능한 오류 현상과 기대 동작 중심의 내용 작성

  - type: textarea
    id: current
    attributes:
      label: 현재 동작
      description: 실제로 발생한 현상 작성
      placeholder: 실제 동작 및 오류 현상
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상적으로 기대하는 동작 작성
      placeholder: 기대 동작
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      description: 오류 재현을 위한 순서 작성
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 발생 환경
      description: 기기, OS, 앱 버전 및 실행 조건 작성
      placeholder: 기기·OS·버전·실행 조건
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: 로그 및 화면 자료
      description: 로그, 스크린샷, 영상 및 관련 링크 첨부
      placeholder: 로그 및 화면 자료
    validations:
      required: false
