name: 개선 작업
description: 사용성·성능·구조 개선 등록
title: "[refactor] "
body:
  - type: markdown
    attributes:
      value: |
        현재 문제와 개선 방향, 완료 조건 중심의 작업 내용 작성

  - type: textarea
    id: current
    attributes:
      label: 현재 문제
      description: 개선이 필요한 현재 상태 작성
      placeholder: 현재 상태 및 문제점
    validations:
      required: true

  - type: textarea
    id: direction
    attributes:
      label: 개선 방향
      description: 목표 상태와 개선 방향 작성
      placeholder: 목표 상태 및 개선 방향
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 포함 범위와 제외 범위 작성
      placeholder: 작업 범위
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 개선 완료를 판단할 수 있는 조건 작성
      placeholder: |
        -
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: 참고 자료
      description: 관련 Issue, 문서 및 화면 자료 첨부
      placeholder: 관련 자료 및 링크
    validations:
      required: false
